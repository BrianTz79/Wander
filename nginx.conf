# ─────────────────────────────────────────────────────────────────────
#  Wander — configuración de nginx (frontend + reverse proxy)
#
#  Este archivo se monta con bind-mount (:ro) desde docker-compose, así
#  que se puede ajustar y recargar sin reconstruir la imagen:
#     docker compose exec frontend nginx -s reload
#
#  Responsabilidades:
#    1. Servir el bundle estático de React (SPA).
#    2. Proxy de /api/ y /socket.io/ al backend.
#    3. Servir /uploads/ directamente desde disco (sin tocar Node).
#    4. Cabeceras de seguridad y CSP.
# ─────────────────────────────────────────────────────────────────────

# ── Clave de cliente para los límites ────────────────────────────────
# Detrás del túnel TODAS las peticiones llegan desde la IP del contenedor
# de cloudflared. Con `$binary_remote_addr` como clave, el límite de 5r/m
# de auth se repartiría entre TODOS los visitantes juntos: con dos
# usuarios reales, el login se bloquearía globalmente.
#
# Cloudflare pone la IP real en CF-Connecting-IP y la sobreescribe en el
# borde (un cliente no puede falsearla a través del túnel). Si la cabecera
# no viene (acceso local directo), se cae a la IP de la conexión.
map $http_cf_connecting_ip $ip_cliente {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Zonas de rate limit a nivel de nginx. Es una segunda capa: el backend
# también limita con express-rate-limit. Esta capa protege incluso si el
# backend está saturado, porque nginx rechaza antes de hacer el proxy.
limit_req_zone $ip_cliente zone=api_general:10m rate=30r/s;
limit_req_zone $ip_cliente zone=api_auth:10m    rate=5r/m;
# Login por Steam: no hay contraseña que adivinar, así que el límite duro
# de auth (5r/m) sobra y además rompe el flujo — una vuelta por Steam son
# dos peticiones seguidas y reintentar dejaría al usuario en 429.
limit_req_zone $ip_cliente zone=api_oauth:10m   rate=20r/m;
limit_conn_zone $ip_cliente zone=conexiones:10m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en las cabeceras ni en las páginas de error.
    server_tokens off;

    # El túnel de Cloudflare termina TLS y hace los redirects; con esto
    # nginx no reescribe a http:// interno.
    absolute_redirect off;

    # Límite de subida. Los adjuntos del chat y los audios de perfil son
    # lo más grande que se sube; el backend valida el tamaño real por tipo.
    client_max_body_size 25M;
    client_body_timeout 60s;
    client_header_timeout 20s;

    # Máximo de conexiones simultáneas por IP.
    limit_conn conexiones 50;

    # ── Compresión ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/woff font/woff2;

    # ── Cabeceras de seguridad (aplican a todas las respuestas) ──────
    # Viven en un archivo aparte porque `add_header` no se hereda de forma
    # acumulativa: cualquier `location` con su propio `add_header` pierde
    # todos los del padre, así que hay que re-incluirlas ahí. Ver el
    # comentario largo en nginx-seguridad.conf.
    include /etc/nginx/nginx-seguridad.conf;

    # ── Content-Security-Policy ──────────────────────────────────────
    # Notas de las decisiones (importantes para no relajarla por accidente):
    #
    #  script-src 'self'  → SIN 'unsafe-inline'. Es la defensa principal
    #      contra XSS almacenado. Wander muestra contenido de usuarios
    #      (bios, comentarios, mensajes), así que esto no se negocia.
    #      Si algo necesita un script inline, va a un archivo aparte.
    #
    #  style-src incluye 'unsafe-inline' porque cada perfil emite su tema
    #      como variables CSS en un <style> y permite CSS propio. El CSS
    #      del usuario se sanitiza con PostCSS y se prefija con su scope
    #      en el backend (services/sanitizar.service.ts) antes de guardarse.
    #
    #  img-src lista los hosts VERIFICADOS de cada proveedor. Si falta uno,
    #      las imágenes fallan en silencio (solo se ve en la consola).
    #      Los primeros de Steam salieron de inspeccionar el feed XML real.
    #
    #      30/07 (Fase 5): la Web API devuelve HOY los avatares desde
    #      `avatars.steamstatic.com` — sin subdominio de CDN — y ese host
    #      NO estaba en la lista. El backend ya lo aceptaba, así que el
    #      avatar de quien entraba con Steam se bloqueaba en el navegador
    #      sin ningún error visible en el servidor. Verificado contra la
    #      respuesta real de GetPlayerSummaries. Se añaden también las
    #      variantes `shared./community.cloudflare` que sirven las
    #      carátulas de los juegos.
    #
    #  media-src incluye 'self' para los audios de fondo de perfil, que se
    #      suben a /uploads y se sirven desde el mismo origen.
    #
    #  frame-ancestors 'none' + X-Frame-Options DENY → sin clickjacking.
    #  object-src 'none' → sin Flash/applets, vector clásico de XSS.
    #  base-uri 'self' → impide que un <base> inyectado secuestre las URLs.
    #  form-action 'self' → un formulario inyectado no puede exfiltrar a otro host.
    set $csp "default-src 'self'";
    set $csp "${csp}; script-src 'self'";
    set $csp "${csp}; style-src 'self' 'unsafe-inline'";
    set $csp "${csp}; img-src 'self' data: blob: https://avatars.steamstatic.com https://cdn.cloudflare.steamstatic.com https://shared.cloudflare.steamstatic.com https://community.cloudflare.steamstatic.com https://avatars.akamai.steamstatic.com https://shared.akamai.steamstatic.com https://community.akamai.steamstatic.com https://avatars.fastly.steamstatic.com https://media.steampowered.com https://cdn.discordapp.com https://i.scdn.co https://media.giphy.com https://media0.giphy.com https://media1.giphy.com https://media2.giphy.com https://media3.giphy.com https://media4.giphy.com https://static-cdn.jtvnw.net https://avatars.githubusercontent.com";
    set $csp "${csp}; media-src 'self' blob:";
    set $csp "${csp}; font-src 'self' data:";
    set $csp "${csp}; connect-src 'self' wss: https://api.lanyard.rest wss://api.lanyard.rest";
    set $csp "${csp}; frame-src 'none'";
    set $csp "${csp}; object-src 'none'";
    set $csp "${csp}; base-uri 'self'";
    set $csp "${csp}; form-action 'self'";
    set $csp "${csp}; frame-ancestors 'none'";
    set $csp "${csp}; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;

    # ── Proxy al backend: API REST ───────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare pone la IP real del visitante aquí; el backend la usa
        # para el rate limit por IP.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Las respuestas de la API nunca se cachean: son por usuario.
        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Steam OpenID. VA ANTES del bloque de auth a propósito: nginx elige la
    # PRIMERA expresión regular que casa, y estas rutas también casarían
    # con `^/api/(auth|oauth)/`, quedando bajo su límite de 5r/m.
    location ~ ^/api/auth/steam {
        limit_req zone=api_oauth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        # El callback espera a que Steam confirme la firma: más margen que
        # el resto de la API, que responde con la DB local.
        proxy_read_timeout 30s;

        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-store" always;
    }

    # Rate limit mucho más estricto en los endpoints de autenticación:
    # 5 por minuto por IP frena el fuerza-bruta de contraseñas.
    location ~ ^/api/(auth|oauth)/ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-store" always;
    }

    # ── Proxy al backend: WebSocket del chat ─────────────────────────
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        # Los websockets se quedan abiertos: timeouts largos.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering off;
    }

    # ── Archivos subidos por usuarios ────────────────────────────────
    # Se sirven desde disco sin pasar por Node. Endurecido a propósito:
    # un archivo subido NUNCA debe poder ejecutarse ni interpretarse.
    location /uploads/ {
        alias /var/www/uploads/;

        # Sin sniffing: un .png que en realidad sea HTML no se renderiza.
        add_header X-Content-Type-Options "nosniff" always;
        # CSP mínima: aunque alguien logre subir un HTML, no ejecuta nada.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Los nombres son cuid generados, así que el contenido es inmutable.
        expires 1y;
        access_log off;

        # Solo se sirven los tipos que el backend valida al subir.
        # Cualquier otra extensión → 404, aunque el archivo exista.
        location ~* ^/uploads/.*\.(png|jpe?g|webp|gif|avif|mp4|webm|mp3|ogg|m4a|wav)$ {
            alias /var/www/uploads/;
            try_files $uri =404;
        }
        location ~* ^/uploads/.*\.(php|phtml|pl|py|jsp|asp|aspx|sh|cgi|html?|htm|svg|js|mjs|css|xml)$ {
            deny all;
            return 404;
        }
    }

    # ── Assets del build de Vite ─────────────────────────────────────
    # Vite genera nombres con hash, así que se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── SEO ──────────────────────────────────────────────────────────
    # El sitemap lo genera el backend (es dinámico: crece con los perfiles).
    location = /sitemap.xml {
        proxy_pass http://backend:4000/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        include /etc/nginx/nginx-seguridad.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        try_files $uri =404;
        include /etc/nginx/nginx-seguridad.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # El HTML nunca se cachea: si no, un deploy nuevo sigue sirviendo
        # el index viejo que apunta a assets que ya no existen.
        location = /index.html {
            include /etc/nginx/nginx-seguridad.conf;
            add_header Content-Security-Policy $csp always;
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires 0;
        }
    }

    # ── Bloqueos ─────────────────────────────────────────────────────
    # Dotfiles (excepto .well-known, que es legítimo).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Archivos que nunca deberían estar servidos, pero por si acaso.
    location ~* \.(env|git|bak|config|sql|sqlite|log|ya?ml|toml|ini|lock|tsx?|jsx?\.map)$ {
        deny all;
        return 404;
    }

    # Rutas comunes de escaneo automatizado. Devolver 404 rápido y sin
    # loguear reduce el ruido y el gasto.
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|\.git/|admin\.php|\.aws/) {
        access_log off;
        deny all;
        return 404;
    }

    # Páginas de error: la SPA las maneja.
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
