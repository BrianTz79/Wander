# ─────────────────────────────────────────────────────────────────────
#  Wander — configuración de nginx (frontend + reverse proxy)
#
#  Este archivo se monta con bind-mount (:ro) desde docker-compose, así
#  que se puede ajustar y recargar sin reconstruir la imagen:
#     docker compose exec frontend nginx -s reload
#
#  Responsabilidades:
#    1. Servir el bundle estático de React (SPA).
#    2. Proxy de /api/ y /socket.io/ al backend.
#    3. Servir /uploads/ directamente desde disco (sin tocar Node).
#    4. Cabeceras de seguridad y CSP.
# ─────────────────────────────────────────────────────────────────────

# ── Clave de cliente para los límites ────────────────────────────────
# Detrás del túnel TODAS las peticiones llegan desde la IP del contenedor
# de cloudflared. Con `$binary_remote_addr` como clave, el límite de 5r/m
# de auth se repartiría entre TODOS los visitantes juntos: con dos
# usuarios reales, el login se bloquearía globalmente.
#
# Cloudflare pone la IP real en CF-Connecting-IP y la sobreescribe en el
# borde (un cliente no puede falsearla a través del túnel). Si la cabecera
# no viene (acceso local directo), se cae a la IP de la conexión.
map $http_cf_connecting_ip $ip_cliente {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Zonas de rate limit a nivel de nginx. Es una segunda capa: el backend
# también limita con express-rate-limit. Esta capa protege incluso si el
# backend está saturado, porque nginx rechaza antes de hacer el proxy.
# ── ¿Es un scraper de tarjetas? ──────────────────────────────────────
# Los perfiles son una SPA (decisión de §0), así que el HTML que llega es
# el mismo `index.html` para todos, con metas fijas. Un navegador ejecuta
# React y ve el perfil; un scraper de Discord/X/WhatsApp NO ejecuta
# JavaScript y se queda con las metas genéricas de Wander, de modo que
# todos los perfiles se previsualizan igual.
#
# Estos user-agents reciben en su lugar el HTML del backend, que trae las
# metas del perfil ya puestas (`/api/seo/perfil/:handle`).
#
# Sobre "engañar al buscador": esto NO es cloaking. El contenido que se
# sirve dice exactamente lo mismo que la página real —nombre, bio y enlace
# al propio perfil— y existe porque el cliente no puede leer el que ya hay.
# Googlebot va incluido para que la SERP muestre el título del perfil, no
# el de la landing repetido en cada resultado.
map $http_user_agent $es_scraper {
    default                        0;
    "~*facebookexternalhit"        1;
    "~*Facebot"                    1;
    "~*Twitterbot"                 1;
    "~*Discordbot"                 1;
    "~*Slackbot"                   1;
    "~*TelegramBot"                1;
    "~*WhatsApp"                   1;
    "~*LinkedInBot"                1;
    "~*Pinterest"                  1;
    "~*redditbot"                  1;
    "~*Googlebot"                  1;
    "~*bingbot"                    1;
    "~*DuckDuckBot"                1;
    "~*Applebot"                   1;
    "~*SkypeUriPreview"            1;
    "~*vkShare"                    1;
    "~*Mastodon"                   1;
    "~*Iframely"                   1;
    # Motores generativos (GEO, §13): citan el perfil si pueden leerlo.
    "~*GPTBot"                     1;
    "~*OAI-SearchBot"              1;
    "~*ChatGPT-User"               1;
    "~*ClaudeBot"                  1;
    "~*Claude-Web"                 1;
    "~*PerplexityBot"              1;
    "~*Google-Extended"            1;
}

limit_req_zone $ip_cliente zone=api_general:10m rate=30r/s;
limit_req_zone $ip_cliente zone=api_auth:10m    rate=5r/m;
# Login por Steam: no hay contraseña que adivinar, así que el límite duro
# de auth (5r/m) sobra y además rompe el flujo — una vuelta por Steam son
# dos peticiones seguidas y reintentar dejaría al usuario en 429.
limit_req_zone $ip_cliente zone=api_oauth:10m   rate=20r/m;
limit_conn_zone $ip_cliente zone=conexiones:10m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en las cabeceras ni en las páginas de error.
    server_tokens off;

    # El túnel de Cloudflare termina TLS y hace los redirects; con esto
    # nginx no reescribe a http:// interno.
    absolute_redirect off;

    # Límite de subida. Los adjuntos del chat y los audios de perfil son
    # lo más grande que se sube; el backend valida el tamaño real por tipo.
    client_max_body_size 25M;
    client_body_timeout 60s;
    client_header_timeout 20s;

    # Máximo de conexiones simultáneas por IP.
    limit_conn conexiones 50;

    # ── Compresión ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/woff font/woff2;

    # ── Cabeceras de seguridad (aplican a todas las respuestas) ──────
    # Viven en un archivo aparte porque `add_header` no se hereda de forma
    # acumulativa: cualquier `location` con su propio `add_header` pierde
    # todos los del padre, así que hay que re-incluirlas ahí. Ver el
    # comentario largo en nginx-seguridad.conf.
    include /etc/nginx/nginx-seguridad.conf;

    # ── Content-Security-Policy ──────────────────────────────────────
    # Notas de las decisiones (importantes para no relajarla por accidente):
    #
    #  script-src 'self'  → SIN 'unsafe-inline'. Es la defensa principal
    #      contra XSS almacenado. Wander muestra contenido de usuarios
    #      (bios, comentarios, mensajes), así que esto no se negocia.
    #      Si algo necesita un script inline, va a un archivo aparte.
    #
    #  style-src incluye 'unsafe-inline' porque cada perfil emite su tema
    #      como variables CSS en un <style> y permite CSS propio. El CSS
    #      del usuario se sanitiza con PostCSS y se prefija con su scope
    #      en el backend (services/sanitizar.service.ts) antes de guardarse.
    #
    #  img-src lista los hosts VERIFICADOS de cada proveedor. Si falta uno,
    #      las imágenes fallan en silencio (solo se ve en la consola).
    #      Los primeros de Steam salieron de inspeccionar el feed XML real.
    #
    #      30/07 (Fase 5): la Web API devuelve HOY los avatares desde
    #      `avatars.steamstatic.com` — sin subdominio de CDN — y ese host
    #      NO estaba en la lista. El backend ya lo aceptaba, así que el
    #      avatar de quien entraba con Steam se bloqueaba en el navegador
    #      sin ningún error visible en el servidor. Verificado contra la
    #      respuesta real de GetPlayerSummaries. Se añaden también las
    #      variantes `shared./community.cloudflare` que sirven las
    #      carátulas de los juegos.
    #
    #  media-src incluye 'self' para los audios de fondo de perfil, que se
    #      suben a /uploads y se sirven desde el mismo origen.
    #
    #  frame-ancestors 'none' + X-Frame-Options DENY → sin clickjacking.
    #  object-src 'none' → sin Flash/applets, vector clásico de XSS.
    #  base-uri 'self' → impide que un <base> inyectado secuestre las URLs.
    #  form-action 'self' → un formulario inyectado no puede exfiltrar a otro host.
    set $csp "default-src 'self'";
    set $csp "${csp}; script-src 'self'";
    set $csp "${csp}; style-src 'self' 'unsafe-inline'";
    set $csp "${csp}; img-src 'self' data: blob: https://avatars.steamstatic.com https://cdn.cloudflare.steamstatic.com https://shared.cloudflare.steamstatic.com https://community.cloudflare.steamstatic.com https://avatars.akamai.steamstatic.com https://shared.akamai.steamstatic.com https://community.akamai.steamstatic.com https://avatars.fastly.steamstatic.com https://media.steampowered.com https://cdn.discordapp.com https://media.discordapp.net https://lh3.googleusercontent.com https://i.scdn.co https://media.giphy.com https://media0.giphy.com https://media1.giphy.com https://media2.giphy.com https://media3.giphy.com https://media4.giphy.com https://static-cdn.jtvnw.net https://avatars.githubusercontent.com";
    set $csp "${csp}; media-src 'self' blob:";
    set $csp "${csp}; font-src 'self' data:";
    set $csp "${csp}; connect-src 'self' wss: https://api.lanyard.rest wss://api.lanyard.rest";
    set $csp "${csp}; frame-src 'none'";
    set $csp "${csp}; object-src 'none'";
    set $csp "${csp}; base-uri 'self'";
    set $csp "${csp}; form-action 'self'";
    set $csp "${csp}; frame-ancestors 'none'";
    set $csp "${csp}; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;

    # ── Proxy al backend: API REST ───────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare pone la IP real del visitante aquí; el backend la usa
        # para el rate limit por IP.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Las respuestas de la API nunca se cachean: son por usuario.
        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Logins por proveedor externo: Steam (OpenID 2.0) y Discord/Google
    # (OAuth 2.0, Fase 6).
    #
    # VA ANTES del bloque de auth a propósito: nginx elige la PRIMERA
    # expresión regular que casa, y estas rutas también casarían con
    # `^/api/(auth|oauth)/`, quedando bajo su límite de 5 r/m.
    #
    # Ese límite es para contraseñas, y aquí haría daño sin proteger nada:
    # un login correcto por estas vías responde 302, no 2xx, así que cada
    # inicio de sesión BUENO gastaría cupo. Es el mismo fallo que ya se
    # corrigió con Steam en la Fase 2 (ver `limiteOAuth` en el backend).
    location ~ ^/api/(auth/steam|oauth/) {
        limit_req zone=api_oauth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        # El callback espera a que Steam confirme la firma: más margen que
        # el resto de la API, que responde con la DB local.
        proxy_read_timeout 30s;

        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-store" always;
    }

    # Lecturas de sesión: NO son intentos de credenciales.
    #
    # VA ANTES del bloque de auth, por la misma regla de la primera regex
    # que casa. `/api/auth/yo` y `/api/auth/refresh` los llama la SPA en
    # CADA carga de página, así que bajo el límite de 5 r/m la tercera
    # navegación de un minuto devolvía 429 y la guarda de rutas mandaba al
    # login: la sesión se caía sola navegando normal. Verificado en
    # producción durante el repaso de la Fase 10 — dos cargas pasaban y de
    # la tercera en adelante todo era 429.
    #
    # Aquí no hay nada que adivinar por fuerza bruta: sin una cookie válida
    # estas rutas responden 401 igual de rápido, y el límite general
    # (30 r/s) sigue cubriendo el abuso. El fuerza-bruta de contraseñas lo
    # frena el bloque de abajo, que es donde vive `/login`.
    location ~ "^/api/auth/(yo|refresh)$" {
        limit_req zone=api_general burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-store" always;
    }

    # Rate limit mucho más estricto en los endpoints de autenticación:
    # 5 por minuto por IP frena el fuerza-bruta de contraseñas.
    location ~ ^/api/(auth|oauth)/ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-store" always;
    }

    # ── Proxy al backend: WebSocket del chat ─────────────────────────
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        # Los websockets se quedan abiertos: timeouts largos.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering off;
    }

    # ── Archivos subidos por usuarios ────────────────────────────────
    # Se sirven desde disco sin pasar por Node. Endurecido a propósito:
    # un archivo subido NUNCA debe poder ejecutarse ni interpretarse.
    #
    # OJO CON `alias` Y LAS REGEX: la versión anterior de este bloque tenía
    # un `alias` dentro de una `location ~*` anidada, y devolvía 404 en
    # archivos que SÍ existían en disco. En una location con expresión
    # regular, `alias` solo funciona bien si la ruta usa las capturas de la
    # propia regex; con una ruta fija, nginx acaba resolviendo contra una
    # ruta que no es la del archivo. Con `root` no pasa: nginx concatena
    # root + URI completa, que es justo lo que hace falta aquí porque la
    # URI (/uploads/...) coincide con la estructura de directorios.
    # Lo cazó el E2E de la Fase 8, pidiendo por HTTP un archivo recién
    # subido en vez de dar por bueno que estaba en el disco.
    #
    # `internal`-mente el orden de nginx también importa: las `location`
    # con regex se evalúan ANTES que el prefijo `/uploads/`, así que la
    # lista negra de extensiones ejecutables corta antes de llegar a servir
    # nada.

    # Extensiones ejecutables o interpretables: 404 aunque el archivo
    # exista. Va PRIMERO porque en nginx la primera regex que casa gana.
    location ~* ^/uploads/.*\.(php|phtml|pl|py|jsp|asp|aspx|sh|cgi|html?|htm|svg|js|mjs|css|xml)$ {
        return 404;
    }

    # ── Audio que nginx no sabe tipar (Fase 11) ──────────────────────
    #
    # El `mime.types` de nginx trae `mp3`, `ogg` y `m4a`, pero NO `wav` ni
    # `weba`, y el backend acepta los dos. Sin tipo salen como
    # `application/octet-stream`, y con `X-Content-Type-Options: nosniff`
    # —que está más abajo y no se va a quitar— el navegador se NIEGA a
    # reproducirlos: el `<audio>` del perfil falla en silencio.
    #
    # Se resuelve con `default_type` en su propia location y no con un
    # bloque `types` porque un `types` a este nivel REEMPLAZA el mapa
    # heredado entero (todo lo demás pasaría a octet-stream), y
    # `mime.types` no se puede re-incluir dentro de otro `types`: ya trae
    # el suyo propio. Va ANTES de la location general de /uploads porque
    # gana la primera regex que casa.
    #
    # Lo cazó el E2E de la Fase 11 mirando la cabecera real, no que el
    # archivo se descargara.
    location ~* "^/uploads/.*\.wav$" {
        root /var/www;
        default_type audio/wav;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'; script-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;

        try_files $uri =404;
    }

    location ~* "^/uploads/.*\.weba$" {
        root /var/www;
        default_type audio/webm;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; media-src 'self'; script-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;

        try_files $uri =404;
    }

    # Solo los tipos que el backend valida al subir.
    location ~* ^/uploads/.*\.(png|jpe?g|webp|gif|avif|mp4|webm|mp3|ogg|m4a|wav|weba)$ {
        root /var/www;

        # Sin sniffing: un .png que en realidad sea HTML no se renderiza.
        add_header X-Content-Type-Options "nosniff" always;
        # CSP mínima: aunque alguien logre subir un HTML, no ejecuta nada.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Los nombres son uuid generados, así que el contenido es inmutable.
        expires 1y;
        access_log off;

        try_files $uri =404;
    }

    # Cualquier otra cosa bajo /uploads/ (sin extensión, o con una que no
    # está en la lista blanca de arriba) no se sirve.
    location /uploads/ {
        return 404;
    }

    # ── Assets del build de Vite ─────────────────────────────────────
    # Vite genera nombres con hash, así que se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── SEO ──────────────────────────────────────────────────────────
    # El sitemap lo genera el backend (es dinámico: crece con los perfiles).
    location = /sitemap.xml {
        proxy_pass http://backend:4000/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        include /etc/nginx/nginx-seguridad.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        try_files $uri =404;
        include /etc/nginx/nginx-seguridad.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Tarjetas al compartir un perfil (Fase 10) ────────────────────
    # A las personas, la SPA de siempre. A los scrapers, el HTML con las
    # metas del perfil ya puestas (ver el `map $es_scraper` de arriba).
    #
    # `$es_scraper` se evalúa aquí y no en el backend porque la decisión es
    # de enrutado: el backend nunca ve las peticiones de HTML, solo las de
    # /api/. Y va con `if` dentro de una location, que es uno de los pocos
    # usos seguros del `if` de nginx: solo hace `rewrite`/`return`.
    # La regex va ENTRECOMILLADA: sin comillas, nginx interpreta las llaves
    # de `{3,24}` como el inicio de un bloque de configuración y aborta con
    # "missing closing parenthesis". Vale para las dos locations de abajo.
    location ~ "^/u/([A-Za-z0-9_-]{3,24})$" {
        set $handle_perfil $1;

        if ($es_scraper) {
            rewrite ^ /_og/$handle_perfil last;
        }

        # Una persona: el index de la SPA, igual que cualquier otra ruta.
        try_files /index.html =404;
        include /etc/nginx/nginx-seguridad.conf;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Destino interno del rewrite de arriba. `internal` para que nadie
    # pueda pedir /_og/... directamente desde fuera y usarlo como un
    # endpoint paralelo de datos de perfil.
    location ~ "^/_og/([A-Za-z0-9_-]{3,24})$" {
        internal;

        proxy_pass http://backend:4000/api/seo/perfil/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        include /etc/nginx/nginx-seguridad.conf;
        # CSP mínima: este HTML no carga scripts ni estilos propios. No se
        # reutiliza $csp porque esa permite 'unsafe-inline' en estilos para
        # los temas de perfil, y aquí no hace ninguna falta.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' https:; style-src 'none'; script-src 'none'" always;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # El HTML nunca se cachea: si no, un deploy nuevo sigue sirviendo
        # el index viejo que apunta a assets que ya no existen.
        location = /index.html {
            include /etc/nginx/nginx-seguridad.conf;
            add_header Content-Security-Policy $csp always;
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires 0;
        }
    }

    # ── Bloqueos ─────────────────────────────────────────────────────
    # Dotfiles (excepto .well-known, que es legítimo).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Archivos que nunca deberían estar servidos, pero por si acaso.
    location ~* \.(env|git|bak|config|sql|sqlite|log|ya?ml|toml|ini|lock|tsx?|jsx?\.map)$ {
        deny all;
        return 404;
    }

    # Rutas comunes de escaneo automatizado. Devolver 404 rápido y sin
    # loguear reduce el ruido y el gasto.
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|\.git/|admin\.php|\.aws/) {
        access_log off;
        deny all;
        return 404;
    }

    # Páginas de error: la SPA las maneja.
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
