# ─────────────────────────────────────────────────────────────────────
#  Wander — cabeceras de seguridad comunes
#
#  Se incluye con `include` en el bloque `server` Y en cada `location`
#  que declare su propio `add_header`.
#
#  El motivo es una trampa clásica de nginx: `add_header` NO se hereda de
#  forma acumulativa. En cuanto un bloque hijo declara un solo
#  `add_header`, se descartan TODOS los del padre. Sin este include, un
#  `location` que solo quería ajustar el `Cache-Control` se quedaba además
#  sin CSP, sin HSTS y sin X-Frame-Options — en silencio, porque la config
#  es válida y nginx no avisa.
#
#  La CSP no va aquí: se arma con `set $csp` en el server y varía según el
#  location (los uploads llevan una mucho más estricta).
# ─────────────────────────────────────────────────────────────────────

add_header X-Content-Type-Options   "nosniff" always;
add_header X-Frame-Options          "DENY" always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# `same-site` en vez de `same-origin`: permite que el CDN de Steam cargue
# las imágenes de los juegos sin bloqueo de CORP.
add_header Cross-Origin-Resource-Policy "same-site" always;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

add_header Permissions-Policy
    "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
